image: node:24-bookworm

stages:
  - verify
  - release

verify:
  stage: verify
  script:
    - npm ci
    - npm run typecheck
    - npm run test:deps
    - npm test
    - npm run smoke
    - npm pack --dry-run
    - git diff --check

publish-npm:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm ci
    - |
      package_version="$(node -p 'require("./package.json").version')"
      test "$CI_COMMIT_TAG" = "v${package_version}"
    - npm run typecheck
    - npm run test:deps
    - npm test
    - npm run smoke
    - npm pack --dry-run
    - |
      package_name="$(node -p 'require("./package.json").name')"
      package_version="$(node -p 'require("./package.json").version')"
      if published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null)" \
        && [ "${published_version}" = "${package_version}" ]; then
        echo "${package_name}@${package_version} is already published; skipping publish."
      else
        npm publish --provenance
      fi
