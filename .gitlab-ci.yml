image: node:24-bookworm

variables:
  GIT_DEPTH: "0"
  PANDOC_VERSION: "3.10.1"

before_script:
  - node -e '(async () => { const response = await fetch(`https://github.com/jgm/pandoc/releases/download/${process.env.PANDOC_VERSION}/pandoc-${process.env.PANDOC_VERSION}-1-amd64.deb`); if (!response.ok) throw new Error(`Pandoc download failed with ${response.status}`); require("node:fs").writeFileSync("/tmp/pandoc.deb", Buffer.from(await response.arrayBuffer())); })().catch(error => { console.error(error); process.exit(1); })'
  - dpkg --install /tmp/pandoc.deb
  - pandoc --version

stages:
  - verify
  - release

verify:
  stage: verify
  script:
    - npm ci
    - npm run typecheck
    - npm run style
    - npm run source:budget
    - npm run test:deps
    - npm test
    - npm run smoke
    - npm pack --dry-run
    - git diff --check

publish-npm:
  stage: release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  id_tokens:
    NPM_ID_TOKEN:
      aud: "npm:registry.npmjs.org"
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - npm ci
    - npm install --global npm@11.16.0
    - npm --version
    - |
      node -e 'const [major, minor, patch] = require("child_process").execFileSync("npm", ["--version"], { encoding: "utf8" }).trim().split(".").map(Number); if (major < 11 || (major === 11 && minor < 5) || (major === 11 && minor === 5 && patch < 1)) throw new Error("npm 11.5.1 or later is required for trusted publishing");'
    - |
      package_version="$(node -p 'require("./package.json").version')"
      test "$CI_COMMIT_TAG" = "v${package_version}"
    - npm run typecheck
    - npm run style
    - npm run source:budget
    - npm run test:deps
    - npm test
    - npm run smoke
    - npm pack --dry-run
    - |
      package_name="$(node -p 'require("./package.json").name')"
      package_version="$(node -p 'require("./package.json").version')"
      if published_version="$(npm view "${package_name}@${package_version}" version 2>/dev/null)" \
        && [ "${published_version}" = "${package_version}" ]; then
        echo "${package_name}@${package_version} is already published; skipping publish."
      else
        npm publish --provenance
      fi
